<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Highlight This</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Highlights on this page</h1>
    </header>
    <p id="excluded" class="empty" hidden>
      Highlighting is turned off on Gmail.

    <p id="empty" class="empty" hidden>
      No highlights yet. Select text on the page, then click Highlight, press
      Alt+H, or right-click and choose "Highlight this".

    <ul id="list"></ul>
    <script src="popup.js"></script>
  </body>
</html>
